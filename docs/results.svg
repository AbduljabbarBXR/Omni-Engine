  <rect x="180" y="110" width="522" height="36" rx="4" fill="#64748b"/>
  <rect x="180" y="166" width="439" height="36" rx="4" fill="#2563eb"/>
  <rect x="180" y="222" width="439" height="36" rx="4" fill="#2563eb"/>
  <rect x="180" y="278" width="439" height="36" rx="4" fill="#2563eb"/>
  <rect x="180" y="334" width="439" height="36" rx="4" fill="#2563eb"/>

